<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <title>REIZO</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding:
        calc(20px + env(safe-area-inset-top))
        16px
        calc(30px + env(safe-area-inset-bottom));
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        sans-serif;
      background: #f4f6f8;
      color: #202124;
    }

    .app {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
    }

    h1 {
      margin: 8px 0 4px;
      font-size: 34px;
      text-align: center;
      letter-spacing: 2px;
    }

    .subtitle {
      margin: 0 0 24px;
      text-align: center;
      color: #687078;
      font-size: 14px;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    .card {
      margin-bottom: 14px;
      padding: 18px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.07);
    }

    .card h2 {
      margin: 0 0 12px;
      font-size: 20px;
    }

    .menu-button {
      width: 100%;
      margin-bottom: 12px;
      padding: 18px;
      border: none;
      border-radius: 16px;
      background: white;
      font-size: 18px;
      font-weight: bold;
      text-align: left;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.07);
    }

    .menu-button:active {
      transform: scale(0.98);
    }

    .primary-button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 14px;
      background: #202124;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .secondary-button {
      width: 100%;
      margin-top: 10px;
      padding: 14px;
      border: 1px solid #c8cdd2;
      border-radius: 14px;
      background: white;
      color: #202124;
      font-size: 16px;
      cursor: pointer;
    }

    label {
      display: block;
      margin: 14px 0 6px;
      font-weight: bold;
      font-size: 14px;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #cfd4d9;
      border-radius: 12px;
      background: white;
      font-size: 16px;
    }

    .item {
      margin-bottom: 10px;
      padding: 14px;
      border-radius: 14px;
      background: white;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.06);
    }

    .item-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }

    .item-name {
      margin: 0;
      font-size: 18px;
      font-weight: bold;
    }

    .item-info {
      margin-top: 6px;
      color: #60676e;
      font-size: 14px;
      line-height: 1.5;
    }

    .delete-button {
      border: none;
      background: transparent;
      color: #d33;
      font-size: 14px;
      cursor: pointer;
    }

    .danger {
      border-left: 6px solid #e53935;
      background: #fff0f0;
    }

    .soon {
      border-left: 6px solid #ff9800;
      background: #fff7e8;
    }

    .week {
      border-left: 6px solid #fbc02d;
      background: #fffbea;
    }

    .safe {
      border-left: 6px solid #43a047;
      background: #f1fff3;
    }

    .empty {
      padding: 22px;
      text-align: center;
      color: #777;
      background: white;
      border-radius: 16px;
    }

    .back-title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .back-button {
      border: none;
      background: white;
      border-radius: 12px;
      padding: 10px 13px;
      font-size: 16px;
      cursor: pointer;
    }

    .back-title h2 {
      margin: 0;
      font-size: 24px;
    }

    .category-chip {
      display: inline-block;
      margin: 5px;
      padding: 10px 14px;
      border-radius: 999px;
      background: #eef1f4;
      font-size: 14px;
    }

    .notice {
      margin-bottom: 14px;
      padding: 12px;
      border-radius: 12px;
      background: #eaf4ff;
      color: #245a86;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <main class="app">

    <section id="homeScreen" class="screen active">
      <h1>REIZO</h1>
      <p class="subtitle">冷蔵庫の食材を、期限が近い順に管理</p>

      <div class="card">
        <h2>賞味期限が近い食材</h2>
        <div id="urgentList"></div>
      </div>

      <button class="menu-button" onclick="showScreen('addScreen')">
        ＋ 食材を追加
      </button>

      <button class="menu-button" onclick="showScreen('stockScreen')">
        🧊 冷蔵庫の中
      </button>

      <button class="menu-button" onclick="showScreen('categoryScreen')">
        📂 カテゴリー
      </button>

      <button class="menu-button" onclick="showScreen('seasoningScreen')">
        🧂 調味料
      </button>
    </section>

    <section id="addScreen" class="screen">
      <div class="back-title">
        <button class="back-button" onclick="showScreen('homeScreen')">
          ←
        </button>
        <h2>食材を追加</h2>
      </div>

      <div class="card">
        <div class="notice">
          入力した食材は、この端末のブラウザ内に保存されます。
        </div>

        <label for="foodName">食材名</label>
        <input
          id="foodName"
          type="text"
          placeholder="例：豚バラ肉"
        >

        <label for="foodCategory">カテゴリー</label>
        <select id="foodCategory">
          <option value="肉">肉</option>
          <option value="魚">魚</option>
          <option value="野菜">野菜</option>
          <option value="卵・乳製品">卵・乳製品</option>
          <option value="飲み物">飲み物</option>
          <option value="冷凍食品">冷凍食品</option>
          <option value="その他">その他</option>
        </select>

        <label for="foodAmount">数量</label>
        <input
          id="foodAmount"
          type="text"
          placeholder="例：300g、2個、1パック"
        >

        <label for="foodExpiry">賞味期限・消費期限</label>
        <input id="foodExpiry" type="date">

        <label for="foodLocation">保存場所</label>
        <select id="foodLocation">
          <option value="冷蔵">冷蔵</option>
          <option value="冷凍">冷凍</option>
          <option value="常温">常温</option>
        </select>

        <button class="primary-button" onclick="addFood()">
          登録する
        </button>

        <button
          class="secondary-button"
          onclick="showScreen('homeScreen')"
        >
          キャンセル
        </button>
      </div>
    </section>

    <section id="stockScreen" class="screen">
      <div class="back-title">
        <button class="back-button" onclick="showScreen('homeScreen')">
          ←
        </button>
        <h2>冷蔵庫の中</h2>
      </div>

      <div id="stockList"></div>
    </section>

    <section id="categoryScreen" class="screen">
      <div class="back-title">
        <button class="back-button" onclick="showScreen('homeScreen')">
          ←
        </button>
        <h2>カテゴリー</h2>
      </div>

      <div class="card">
        <div class="category-chip">肉</div>
        <div class="category-chip">魚</div>
        <div class="category-chip">野菜</div>
        <div class="category-chip">卵・乳製品</div>
        <div class="category-chip">飲み物</div>
        <div class="category-chip">冷凍食品</div>
        <div class="category-chip">その他</div>
      </div>

      <div id="categoryList"></div>
    </section>

    <section id="seasoningScreen" class="screen">
      <div class="back-title">
        <button class="back-button" onclick="showScreen('homeScreen')">
          ←
        </button>
        <h2>調味料</h2>
      </div>

      <div class="card">
        <p>
          調味料の登録機能は、次の段階で追加予定です。
        </p>

        <p>
          しょうゆ、味噌、塩、砂糖、酢、油などを別枠で管理します。
        </p>
      </div>
    </section>

  </main>

  <script>
    const STORAGE_KEY = "reizoFoods";

    let foods = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

    function showScreen(screenId) {
      document.querySelectorAll(".screen").forEach((screen) => {
        screen.classList.remove("active");
      });

      document.getElementById(screenId).classList.add("active");

      if (screenId === "homeScreen") {
        renderUrgentFoods();
      }

      if (screenId === "stockScreen") {
        renderStock();
      }

      if (screenId === "categoryScreen") {
        renderCategories();
      }

      window.scrollTo(0, 0);
    }

    function addFood() {
      const name = document.getElementById("foodName").value.trim();
      const category = document.getElementById("foodCategory").value;
      const amount = document.getElementById("foodAmount").value.trim();
      const expiry = document.getElementById("foodExpiry").value;
      const location = document.getElementById("foodLocation").value;

      if (!name) {
        alert("食材名を入力してください。");
        return;
      }

      if (!expiry) {
        alert("賞味期限・消費期限を入力してください。");
        return;
      }

      const food = {
        id: Date.now(),
        name,
        category,
        amount: amount || "数量未入力",
        expiry,
        location,
        createdAt: new Date().toISOString()
      };

      foods.push(food);
      saveFoods();

      document.getElementById("foodName").value = "";
      document.getElementById("foodAmount").value = "";
      document.getElementById("foodExpiry").value = "";

      alert("食材を登録しました！");
      showScreen("homeScreen");
    }

    function saveFoods() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(foods));
    }

    function deleteFood(id) {
      const confirmed = confirm("この食材を削除しますか？");

      if (!confirmed) {
        return;
      }

      foods = foods.filter((food) => food.id !== id);
      saveFoods();
      renderStock();
      renderUrgentFoods();
      renderCategories();
    }

    function getDaysLeft(expiry) {
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      const expiryDate = new Date(expiry + "T00:00:00");
      const difference = expiryDate - today;

      return Math.ceil(difference / (1000 * 60 * 60 * 24));
    }

    function getStatus(daysLeft) {
      if (daysLeft < 0) {
        return {
          className: "danger",
          text: `${Math.abs(daysLeft)}日期限切れ`
        };
      }

      if (daysLeft === 0) {
        return {
          className: "danger",
          text: "今日が期限"
        };
      }

      if (daysLeft <= 3) {
        return {
          className: "soon",
          text: `あと${daysLeft}日`
        };
      }

      if (daysLeft <= 7) {
        return {
          className: "week",
          text: `あと${daysLeft}日`
        };
      }

      return {
        className: "safe",
        text: `あと${daysLeft}日`
      };
    }

    function sortFoods(list) {
      return [...list].sort((a, b) => {
        return new Date(a.expiry) - new Date(b.expiry);
      });
    }

    function createFoodHtml(food, showDeleteButton = true) {
      const daysLeft = getDaysLeft(food.expiry);
      const status = getStatus(daysLeft);

      return `
        <div class="item ${status.className}">
          <div class="item-top">
            <div>
              <p class="item-name">${escapeHtml(food.name)}</p>
              <div class="item-info">
                ${escapeHtml(food.category)} ／
                ${escapeHtml(food.amount)}<br>
                保存：${escapeHtml(food.location)}<br>
                期限：${food.expiry}（${status.text}）
              </div>
            </div>

            ${
              showDeleteButton
                ? `
                  <button
                    class="delete-button"
                    onclick="deleteFood(${food.id})"
                  >
                    削除
                  </button>
                `
                : ""
            }
          </div>
        </div>
      `;
    }

    function renderUrgentFoods() {
      const urgentList = document.getElementById("urgentList");
      const sortedFoods = sortFoods(foods);
      const urgentFoods = sortedFoods.filter((food) => {
        return getDaysLeft(food.expiry) <= 7;
      });

      if (urgentFoods.length === 0) {
        urgentList.innerHTML = `
          <div class="empty">
            7日以内に期限が来る食材はありません。
          </div>
        `;
        return;
      }

      urgentList.innerHTML = urgentFoods
        .slice(0, 5)
        .map((food) => createFoodHtml(food, false))
        .join("");
    }

    function renderStock() {
      const stockList = document.getElementById("stockList");
      const sortedFoods = sortFoods(foods);

      if (sortedFoods.length === 0) {
        stockList.innerHTML = `
          <div class="empty">
            まだ食材が登録されていません。
          </div>
        `;
        return;
      }

      stockList.innerHTML = sortedFoods
        .map((food) => createFoodHtml(food, true))
        .join("");
    }

    function renderCategories() {
      const categoryList = document.getElementById("categoryList");
      const categories = {};

      sortFoods(foods).forEach((food) => {
        if (!categories[food.category]) {
          categories[food.category] = [];
        }

        categories[food.category].push(food);
      });

      const categoryNames = Object.keys(categories);

      if (categoryNames.length === 0) {
        categoryList.innerHTML = `
          <div class="empty">
            食材を登録すると、カテゴリー別に表示されます。
          </div>
        `;
        return;
      }

      categoryList.innerHTML = categoryNames
        .map((category) => {
          const items = categories[category]
            .map((food) => createFoodHtml(food, false))
            .join("");

          return `
            <div class="card">
              <h2>${escapeHtml(category)}</h2>
              ${items}
            </div>
          `;
        })
        .join("");
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    renderUrgentFoods();
  </script>
</body>
</html>
