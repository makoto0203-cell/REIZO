<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <meta name="theme-color" content="#edf7f5">
  <title>REIZO｜冷蔵庫管理</title>

  <style>
    :root {
      --main: #19796b;
      --main-dark: #105c52;
      --main-light: #dff3ef;
      --background: #f4f8f7;
      --card: #ffffff;
      --text: #1f2927;
      --subtext: #697471;
      --border: #d9e2df;
      --danger: #d64545;
      --warning: #e89024;
      --yellow: #d6ac18;
      --safe: #33985c;
      --shadow: 0 7px 24px rgba(24, 67, 59, 0.09);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding:
        calc(14px + env(safe-area-inset-top))
        14px
        calc(36px + env(safe-area-inset-bottom));
      color: var(--text);
      background:
        radial-gradient(circle at top, #edf9f6 0, var(--background) 360px);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Helvetica Neue",
        Arial,
        sans-serif;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      touch-action: manipulation;
    }

    .app {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
    }

    .screen {
      display: none;
      animation: fadeIn 0.18s ease;
    }

    .screen.active {
      display: block;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(4px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .hero {
      padding: 18px 8px 16px;
      text-align: center;
    }

    .logo {
      margin: 0;
      color: var(--main-dark);
      font-size: 38px;
      font-weight: 900;
      letter-spacing: 4px;
    }

    .subtitle {
      margin: 6px 0 0;
      color: var(--subtext);
      font-size: 14px;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
      margin-bottom: 14px;
    }

    .summary-card {
      padding: 14px 6px;
      border: 1px solid rgba(25, 121, 107, 0.08);
      border-radius: 17px;
      background: var(--card);
      box-shadow: var(--shadow);
      text-align: center;
    }

    .summary-number {
      display: block;
      color: var(--main-dark);
      font-size: 25px;
      font-weight: 900;
    }

    .summary-label {
      display: block;
      margin-top: 3px;
      color: var(--subtext);
      font-size: 12px;
    }

    .card {
      margin-bottom: 14px;
      padding: 17px;
      border: 1px solid rgba(25, 121, 107, 0.07);
      border-radius: 19px;
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0 0 13px;
      font-size: 20px;
    }

    .section-note {
      color: var(--subtext);
      font-size: 12px;
      font-weight: 500;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 11px;
      margin-bottom: 14px;
    }

    .menu-button {
      min-height: 108px;
      padding: 16px 11px;
      border: 1px solid rgba(25, 121, 107, 0.08);
      border-radius: 19px;
      color: var(--text);
      background: var(--card);
      box-shadow: var(--shadow);
      cursor: pointer;
      text-align: left;
      transition:
        transform 0.12s ease,
        box-shadow 0.12s ease;
    }

    .menu-button:active {
      transform: scale(0.97);
      box-shadow: none;
    }

    .menu-icon {
      display: block;
      margin-bottom: 9px;
      font-size: 27px;
    }

    .menu-title {
      display: block;
      font-size: 17px;
      font-weight: 800;
    }

    .menu-description {
      display: block;
      margin-top: 4px;
      color: var(--subtext);
      font-size: 12px;
      line-height: 1.4;
    }

    .page-header {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 9px 0 15px;
    }

    .page-header h2 {
      margin: 0;
      font-size: 25px;
    }

    .back-button {
      flex: 0 0 auto;
      width: 44px;
      height: 44px;
      border: 1px solid var(--border);
      border-radius: 14px;
      color: var(--main-dark);
      background: white;
      cursor: pointer;
      font-size: 22px;
      font-weight: bold;
      box-shadow: 0 4px 13px rgba(0, 0, 0, 0.06);
    }

    .field {
      margin-bottom: 14px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: 800;
    }

    .required {
      margin-left: 4px;
      color: var(--danger);
      font-size: 11px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid var(--border);
      border-radius: 13px;
      outline: none;
      color: var(--text);
      background: white;
      font-size: 16px;
      transition:
        border-color 0.15s ease,
        box-shadow 0.15s ease;
    }

    textarea {
      min-height: 85px;
      resize: vertical;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--main);
      box-shadow: 0 0 0 3px rgba(25, 121, 107, 0.12);
    }

    .two-columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 11px;
    }

    .button-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 18px;
    }

    .primary-button,
    .secondary-button,
    .danger-button {
      width: 100%;
      min-height: 49px;
      padding: 12px;
      border-radius: 14px;
      cursor: pointer;
      font-weight: 800;
    }

    .primary-button {
      border: none;
      color: white;
      background: var(--main);
    }

    .primary-button:active {
      background: var(--main-dark);
    }

    .secondary-button {
      border: 1px solid var(--border);
      color: var(--text);
      background: white;
    }

    .danger-button {
      border: 1px solid #f1c4c4;
      color: var(--danger);
      background: #fff7f7;
    }

    .notice {
      margin-bottom: 15px;
      padding: 12px 13px;
      border-radius: 13px;
      color: #245e55;
      background: var(--main-light);
      font-size: 13px;
      line-height: 1.55;
    }

    .search-area {
      display: grid;
      grid-template-columns: 1fr 125px;
      gap: 9px;
      margin-bottom: 13px;
    }

    .category-tabs {
      display: flex;
      gap: 8px;
      margin: 0 -2px 14px;
      padding: 2px 2px 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .category-tabs::-webkit-scrollbar {
      display: none;
    }

    .chip {
      flex: 0 0 auto;
      padding: 9px 14px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--subtext);
      background: white;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
    }

    .chip.active {
      border-color: var(--main);
      color: white;
      background: var(--main);
    }

    .food-item {
      position: relative;
      margin-bottom: 10px;
      padding: 15px 14px 13px 17px;
      border: 1px solid rgba(0, 0, 0, 0.04);
      border-left: 6px solid var(--safe);
      border-radius: 16px;
      background: white;
      box-shadow: 0 4px 14px rgba(25, 67, 59, 0.07);
    }

    .food-item.expired {
      border-left-color: var(--danger);
      background: #fff4f4;
    }

    .food-item.today {
      border-left-color: var(--danger);
      background: #fff4f4;
    }

    .food-item.soon {
      border-left-color: var(--warning);
      background: #fff9ef;
    }

    .food-item.week {
      border-left-color: var(--yellow);
      background: #fffcef;
    }

    .food-item.safe {
      border-left-color: var(--safe);
      background: #f8fff9;
    }

    .food-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .food-name {
      margin: 0;
      font-size: 18px;
      font-weight: 900;
      overflow-wrap: anywhere;
    }

    .status-badge {
      flex: 0 0 auto;
      padding: 5px 8px;
      border-radius: 999px;
      color: white;
      background: var(--safe);
      font-size: 11px;
      font-weight: 800;
    }

    .status-badge.expired {
    background: #333333;
}

.status-badge.today {
    background: var(--danger);
}

    .status-badge.soon {
      background: var(--warning);
    }

    .status-badge.week {
      background: var(--yellow);
    }

    .food-info {
      margin-top: 7px;
      color: var(--subtext);
      font-size: 13px;
      line-height: 1.6;
    }

    .food-note {
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px dashed rgba(0, 0, 0, 0.1);
      color: #4f5e5a;
      font-size: 12px;
    }

    .item-actions {
      display: flex;
      justify-content: flex-end;
      gap: 7px;
      margin-top: 10px;
    }

    .small-button {
      padding: 7px 11px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: white;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
    }

    .small-button.delete {
      border-color: #f0caca;
      color: var(--danger);
      background: #fffafa;
    }

    .empty {
      padding: 28px 15px;
      border: 1px dashed var(--border);
      border-radius: 16px;
      color: var(--subtext);
      background: rgba(255, 255, 255, 0.7);
      text-align: center;
      font-size: 14px;
      line-height: 1.6;
    }

    .category-block {
      margin-bottom: 14px;
    }

    .category-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 0 9px;
      padding: 0 3px;
    }

    .category-heading h3 {
      margin: 0;
      font-size: 18px;
    }

    .category-count {
      color: var(--subtext);
      font-size: 12px;
    }

    .footer-note {
      margin: 21px 0 5px;
      color: var(--subtext);
      text-align: center;
      font-size: 11px;
    }

    .toast {
      position: fixed;
      z-index: 100;
      right: 16px;
      bottom: calc(18px + env(safe-area-inset-bottom));
      left: 16px;
      max-width: 520px;
      margin: 0 auto;
      padding: 13px 16px;
      border-radius: 14px;
      color: white;
      background: #263632;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.22);
      opacity: 0;
      pointer-events: none;
      text-align: center;
      transform: translateY(18px);
      transition:
        opacity 0.22s ease,
        transform 0.22s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 390px) {
      .two-columns,
      .button-row {
        grid-template-columns: 1fr;
      }

      .search-area {
        grid-template-columns: 1fr;
      }

      .menu-button {
        min-height: 100px;
      }
    }
  </style>
</head>

<body>
  <main class="app">

    <!-- ホーム -->
    <section id="homeScreen" class="screen active">
      <header class="hero">
        <h1 class="logo">REIZO</h1>
        <p class="subtitle">冷蔵庫の食材を、期限が近い順に管理</p>
      </header>

      <div class="summary-grid">
        <div class="summary-card">
          <span id="totalCount" class="summary-number">0</span>
          <span class="summary-label">登録食材</span>
        </div>

        <div class="summary-card">
          <span id="urgentCount" class="summary-number">0</span>
          <span class="summary-label">3日以内</span>
        </div>

        <div class="summary-card">
          <span id="seasoningCount" class="summary-number">0</span>
          <span class="summary-label">調味料</span>
        </div>
      </div>
<div class="card" onclick="showShoppingList()">
    <h2 class="section-title">
        🛒 次回購入 <span class="section-note">→</span>
        <span class="section-note" id="shoppingCount">0件</span>
    </h2>

    <div id="shoppingList"></div>
</div>
      <div class="card">
        <h2 class="section-title">
          賞味期限が近い食材
          <span class="section-note">期限順</span>
        </h2>

        <div id="urgentList"></div>
      <div style="text-align: right; margin-top: 12px;">
  <a href="#"
   id="viewAllUrgent"
   onclick="document.getElementById('stockSort').value='expiry'; showScreen('stockScreen'); renderStock(); return false;">
  すべて見る →
</a>
</div>
      </div>

      <div class="menu-grid">
        <button
          class="menu-button"
          type="button"
          onclick="openAddFood()"
        >
          <span class="menu-icon">＋</span>
          <span class="menu-title">食材を追加</span>
          <span class="menu-description">
            食品名・数量・期限を登録
          </span>
        </button>

        <button
          class="menu-button"
          type="button"
          onclick="document.getElementById('stockSort').value='expiry'; showScreen('stockScreen'); renderStock();"
        >
          <span class="menu-icon">🧊</span>
          <span class="menu-title">冷蔵庫の中</span>
          <span class="menu-description">
            在庫を期限順に確認
          </span>
        </button>

        <button
          class="menu-button"
          type="button"
          onclick="showScreen('categoryScreen')"
        >
          <span class="menu-icon">📂</span>
          <span class="menu-title">カテゴリー</span>
          <span class="menu-description">
            肉・魚・野菜などで表示
          </span>
        </button>

        <button
          class="menu-button"
          type="button"
          onclick="showScreen('seasoningScreen')"
        >
          <span class="menu-icon">🧂</span>
          <span class="menu-title">調味料</span>
          <span class="menu-description">
            調味料を別枠で管理
          </span>
        </button>
      </div>

      <p class="footer-note">
        データはこのブラウザ内に保存されます
      </p>
    </section>

    <!-- 食材追加・編集 -->
    <section id="addScreen" class="screen">
      <header class="page-header">
        <button
          class="back-button"
          type="button"
          onclick="showScreen('homeScreen')"
          aria-label="戻る"
        >
          ←
        </button>

        <h2 id="foodFormTitle">食材を追加</h2>
      </header>

      <div class="card">
        <div class="notice">
          食材名と期限は必須です。登録内容は、このブラウザ内に保存されます。
        </div>

        <input id="editingFoodId" type="hidden">

        <div class="field">
          <label for="foodName">
            食材名<span class="required">必須</span>
          </label>

          <input
            id="foodName"
            type="text"
            maxlength="40"
            placeholder="例：豚バラ肉"
            autocomplete="off"
          oninput="autoSelectFoodCategory()"
          >
        </div>

        <div class="two-columns">
          <div class="field">
            <label for="foodCategory">カテゴリー</label>

            <select id="foodCategory" onchange="setDefaultUnitByCategory()">
              <option value="肉">肉</option>
              <option value="魚">魚</option>
              <option value="野菜">野菜</option>
              <option value="果物">果物</option>
              <option value="卵・乳製品">卵・乳製品</option>
              <option value="主食">主食</option>
              <option value="飲み物">飲み物</option>
              <option value="冷凍食品">冷凍食品</option>
              <option value="加工食品">加工食品</option>
              <option value="その他">その他</option>
            </select>
          </div>
          <div class="field" id="foodTypeField" style="display:none;">
  <label for="foodType">種類</label>

  <select id="foodType">
    <option value="">選択してください</option>
    
    
    
  </select>
</div>

          <div class="field">
            <label for="foodLocation">保存場所</label>

            <select id="foodLocation">
              <option value="冷蔵">冷蔵</option>
              <option value="冷凍">冷凍</option>
              <option value="野菜室">野菜室</option>
              <option value="常温">常温</option>
            </select>
          </div>
        </div>

        <div class="two-columns">
          <div class="field">
            <label for="foodAmount">数量</label>

            <input
              id="foodAmount"
              type="number"
              min="0"
              step="any"
              inputmode="decimal"
              placeholder="例：300"
            >
          </div>

          <div class="field">
            <label for="foodUnit">単位</label>

            <select id="foodUnit">
              <option value="g">g</option>
              <option value="kg">kg</option>
              <option value="個">個</option>
              <option value="本">本</option>
              <option value="枚">枚</option>
              <option value="袋">袋</option>
              <option value="パック">パック</option>
              <option value="箱">箱</option>
              <option value="ml">ml</option>
              <option value="L">L</option>
              <option value="食">食</option>
              <option value="">単位なし</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label for="foodExpiry">
            賞味期限・消費期限<span class="required">必須</span>
          </label>

          <input id="foodExpiry" type="date">
        </div>

        <div class="field">
          <label for="foodPurchaseDate">購入日</label>
          <input id="foodPurchaseDate" type="date">
        </div>

        <div class="field">
          <label for="foodNote">メモ</label>

          <textarea
            id="foodNote"
            maxlength="120"
            placeholder="例：開封済み、半分使用など"
          ></textarea>
        </div>

        <div class="button-row">
          <button
            class="secondary-button"
            type="button"
            onclick="cancelFoodForm()"
          >
            キャンセル
          </button>

          <button
            id="foodSaveButton"
            class="primary-button"
            type="button"
            onclick="saveFoodFromForm()"
          >
            登録する
          </button>
        </div>
      </div>
    </section>

    <!-- 冷蔵庫内 -->
    <section id="stockScreen" class="screen">
      <header class="page-header">
        <button
          class="back-button"
          type="button"
          onclick="showScreen('homeScreen')"
          aria-label="戻る"
        >
          ←
        </button>

        <h2>冷蔵庫の中</h2>
      </header>

      <div class="search-area">
        <input
          id="stockSearch"
          type="search"
          placeholder="食材名を検索"
          oninput="renderStock()"
        >

        <select id="stockSort" onchange="renderStock()">
          <option value="expiry">期限が近い順</option>
          <option value="newest">登録が新しい順</option>
          <option value="name">名前順</option>
        </select>
      </div>

      <div id="stockCategoryTabs" class="category-tabs"></div>
      <div id="stockList"></div>
    </section>

    <!-- カテゴリー -->
    <section id="categoryScreen" class="screen">
      <header class="page-header">
        <button
          class="back-button"
          type="button"
          onclick="showScreen('homeScreen')"
          aria-label="戻る"
        >
          ←
        </button>

        <h2>カテゴリー</h2>
      </header>

      <div id="categoryList"></div>
    </section>
<!-- 次回購入 -->
<section id="shoppingScreen" class="screen">
    <header class="page-header">
        <button
            class="back-button"
            type="button"
            onclick="showScreen('homeScreen')"
            aria-label="戻る"
        >
            ←
        </button>

        <h2>🛒 次回購入</h2>
    </header>

    <div id="shoppingFoodList"></div>
</section>
    <!-- 調味料 -->
    <section id="seasoningScreen" class="screen">
      <header class="page-header">
        <button
          class="back-button"
          type="button"
          onclick="showScreen('homeScreen')"
          aria-label="戻る"
        >
          ←
        </button>

        <h2>調味料</h2>
      </header>

      <button
        class="primary-button"
        type="button"
        onclick="openAddSeasoning()"
        style="margin-bottom: 14px;"
      >
        ＋ 調味料を追加
      </button>

      <div id="seasoningList"></div>
    </section>

    <!-- 調味料追加・編集 -->
    <section id="seasoningFormScreen" class="screen">
      <header class="page-header">
        <button
          class="back-button"
          type="button"
          onclick="showScreen('seasoningScreen')"
          aria-label="戻る"
        >
          ←
        </button>

        <h2 id="seasoningFormTitle">調味料を追加</h2>
      </header>

      <div class="card">
        <input id="editingSeasoningId" type="hidden">

        <div class="field">
          <label for="seasoningName">
            調味料名<span class="required">必須</span>
          </label>

          <input
            id="seasoningName"
            type="text"
            maxlength="40"
            placeholder="例：しょうゆ"
          oninput="autoSelectSeasoningType()"
          >
        </div>
<div class="field">
  <label for="seasoningType">種類</label>

  <select id="seasoningType">
    <option value="">選択してください</option>
    <option value="基本調味料">基本調味料</option>
    <option value="ソース">ソース</option>
    <option value="油">油</option>

    function renderStock() {
      const stockList = document.getElementById("stockList");
      const searchInput = document.getElementById("stockSearch");
      const sortSelect = document.getElementById("stockSort");

      const searchText = searchInput
        ? searchInput.value.trim().toLowerCase()

        ? sortSelect.value
        : "expiry";

      let filteredFoods = foods.filter(function(food) {
        const categoryMatches =
          selectedStockCategory === "すべて" ||
          food.category === selectedStockCategory;

        const nameMatches =
          !searchText ||
          String(food.name).toLowerCase().includes(searchText);

        return categoryMatches && nameMatches;
      });

      if (sortType === "expiry") {
        filteredFoods = sortFoodsByExpiry(filteredFoods);
      }

      if (sortType === "newest") {
        filteredFoods.sort(function(a, b) {
          return Number(b.id) - Number(a.id);
        });
      }

      if (sortType === "name") {
        filteredFoods.sort(function(a, b) {
          return String(a.name).localeCompare(
            String(b.name),
            "ja"

        });

    function createAmountText(food) {
      const hasAmount =
        food.amount !== undefined &&
        food.amount !== null &&
        String(food.amount).trim() !== "";

      if (!hasAmount) {
        return "未入力";
      }

      return String(food.amount) + String(food.unit || "");
    }

    function sortFoodsByExpiry(list) {
      return list.slice().sort(function(a, b) {
        const dateA = new Date(a.expiry + "T00:00:00");
        const dateB = new Date(b.expiry + "T00:00:00");

        return dateA - dateB;
      });
    }

    function getDaysLeft(expiry) {
      if (!expiry) {
        return 999999;
      }

      const today = new Date();
      today.setHours(0, 0, 0, 0);

      const expiryDate = new Date(expiry + "T00:00:00");

      return Math.ceil(
        (expiryDate - today) / 86400000
      );
    }

    function getFoodStatus(daysLeft) {

    // 期限切れ
    if (daysLeft < 0) {
        return {
            className: "expired",
            text: Math.abs(daysLeft) + "日経過"
        };
    }

    // 今日まで
    if (daysLeft === 0) {
        return {
            className: "today",
            text: "今日まで"
        };
    }

    // あと1日
    if (daysLeft === 1) {
        return {
            className: "today",
            text: "あと1日"
        };
    }

    // あと2〜6日
    if (daysLeft <= 6) {
        return {
            className: "soon",
            text: "あと" + daysLeft + "日"
        };
    }

    // あと7〜19日
    if (daysLeft <= 19) {
        return {
            className: "week",
            text: "あと" + daysLeft + "日"
        };
    }

    // あと20日以上
    return {
        className: "safe",
        text: "あと" + daysLeft + "日"
    };
}

function autoSelectFoodCategory() {
  const foodName = document
    .getElementById("foodName")
    .value
    .replace(/\s+/g, "")
    .toLowerCase();

  if (!foodName) {
    return;
  }

  const matchedVegetable = Object.keys(vegetableDatabase)
    .sort(function(a, b) {
      return b.length - a.length;
    })
    .find(function(name) {
      return foodName.includes(name.toLowerCase());
    });

  if (matchedVegetable) {
    document.getElementById("foodCategory").value = "野菜";
    setDefaultUnitByCategory();

    document.getElementById("foodType").value =
      vegetableDatabase[matchedVegetable];

    return;
  }

  const matchedMeat = Object.keys(meatDatabase)
    .sort(function(a, b) {
      return b.length - a.length;
    })
    .find(function(name) {
      return foodName.includes(name.toLowerCase());
    });

  if (matchedMeat) {
    document.getElementById("foodCategory").value = "肉";
    setDefaultUnitByCategory();

    document.getElementById("foodType").value =
      meatDatabase[matchedMeat];

    return;
  }

  const matchedFish = Object.keys(fishDatabase)
    .sort(function(a, b) {
      return b.length - a.length;
    })
    .find(function(name) {
      return foodName.includes(name.toLowerCase());
    });

  if (matchedFish) {
    document.getElementById("foodCategory").value = "魚";
    setDefaultUnitByCategory();

    document.getElementById("foodType").value =
      fishDatabase[matchedFish];
  }
  const matchedDrink = Object.keys(drinkDatabase)
    .sort(function(a, b) {
      return b.length - a.length;
    })
    .find(function(name) {
      return foodName.includes(name.toLowerCase());
    });

  if (matchedDrink) {
    document.getElementById("foodCategory").value = "飲み物";

    setDefaultUnitByCategory();

    document.getElementById("foodType").value =
      drinkDatabase[matchedDrink];
  }
  const matchedDairy = Object.keys(dairyDatabase)
    .sort(function(a, b) {
      return b.length - a.length;
    })
    .find(function(name) {
      return foodName.includes(name.toLowerCase());
    });

  if (matchedDairy) {
    document.getElementById("foodCategory").value = "卵・乳製品";

    setDefaultUnitByCategory();

    document.getElementById("foodType").value =
      dairyDatabase[matchedDairy];
  }

const matchedStaple = Object.keys(stapleDatabase)
  .sort(function(a, b) {
    return b.length - a.length;
  })
  .find(function(name) {
    return foodName.includes(name.toLowerCase());
  });

if (matchedStaple) {

],
"飲み物": [

  "炭酸飲料",

]
};

if (foodTypes[category]) {
  foodTypeField.style.display = "block";
  foodType.innerHTML = '<option value="">選択してください</option>';

} else {
  foodTypeField.style.display = "none";
}
    switch (category) {
        case "肉":
        case "魚":
            unit.value = "g";
            break;

        case "卵・乳製品":
            unit.value = "個";
            break;

        case "野菜":
        case "果物":
            unit.value = "個";
            break;

        case "飲み物":
            unit.value = "ml";
            break;

        default:

            break;
    }
}
    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeForAttribute(value) {
      return String(value ?? "")
        .replaceAll("\\", "\\\\")
        .replaceAll("'", "\\'");
    }

    function showToast(message) {
      const toast = document.getElementById("toast");

      toast.textContent = message;
      toast.classList.add("show");

      clearTimeout(toastTimer);

      toastTimer = setTimeout(function() {
        toast.classList.remove("show");
      }, 2200);
    }
function toggleShoppingItem(id) {
    const food = foods.find(function(item) {
        return item.id === id;
    });

    if (!food) {
        return;
    }

    food.shopping = !food.shopping;

    saveFoods();
    renderCategories();
    renderHome();

    showToast(
        food.shopping
            ? "買い物リストに追加しました"
            : "買い物リストから外しました"
    );
}

function renderShoppingFoodList() {
    const shoppingFoods = foods.filter(function(food) {
        return food.shopping;
    });

    const shoppingFoodList = document.getElementById("shoppingFoodList");

    const shoppingSeasonings = seasonings.filter(function(item) {
    return item.buyNext;
});

if (shoppingFoods.length === 0 && shoppingSeasonings.length === 0) {
    shoppingFoodList.innerHTML = createEmptyHtml("買い物リストは空です。");
    return;
}
  

shoppingFoodList.innerHTML =
    shoppingFoods
        .map(function(food) {
            return createFoodHtml(food, false);
        })
        .join("") +
    shoppingSeasonings
        .map(function(item) {
            return"";
        })
        .join("");
}

function showShoppingList() {
    showScreen("shoppingScreen");
renderShoppingFoodList();
    setTimeout(function () {
        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });
    }, 100);
}
    renderHome();
  </script>
